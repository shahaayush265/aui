<!-- AUI Hairline Bento Grid (1px authentic engineering grid dividers) -->
<div class="hairline-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));">
  
  <!-- Cell 01 -->
  <div style="position: relative; background: var(--bg); padding: 2rem;">
    <!-- Corner Crosshair Ticks -->
    <span aria-hidden="true" class="tick tick-half tick-tl"></span>
    <span aria-hidden="true" class="tick tick-half tick-tr"></span>
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span class="hud-label" style="color: var(--accent-ink);">01 // CORE</span>
      <span class="hud-label" style="color: var(--faint);">60 FPS</span>
    </div>
    <h3 class="font-display" style="font-size: 1.5rem; margin-top: 1rem; color: var(--ink-strong);">
      High-Craft Rendering
    </h3>
    <p style="color: var(--muted); margin-top: 0.5rem; line-height: 1.6;">
      Zero layout jitter, sub-pixel alignment, and instant response under all viewport constraints.
    </p>
  </div>

  <!-- Cell 02 -->
  <div style="position: relative; background: var(--bg); padding: 2rem;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span class="hud-label" style="color: var(--accent-ink);">02 // TELEMETRY</span>
      <span class="hud-label" style="color: var(--faint);">ACTIVE</span>
    </div>
    <h3 class="font-display" style="font-size: 1.5rem; margin-top: 1rem; color: var(--ink-strong);">
      Agent Control Surface
    </h3>
    <p style="color: var(--muted); margin-top: 0.5rem; line-height: 1.6;">
      Built with clean semantic selectors, HUD telemetry, and deterministic UI state designed for AI agents.
    </p>
  </div>

</div>
