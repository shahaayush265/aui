<!-- AUI Precision Ruler Scrollbar HTML Scaffold -->
<aside class="aui-ruler-rail" aria-label="Precision Scroll Gauge">
  <div class="aui-ruler-ticks-track">
    <!-- Generated dynamically or server-rendered: 0% to 100% -->
  </div>
  <div class="aui-ruler-sections-track">
    <!-- Section markers -->
  </div>
  <div class="aui-ruler-cursor">
    <span class="aui-ruler-needle"></span>
    <div class="aui-ruler-readout">
      <span class="ruler-digits">
        <span class="ruler-digit-col" data-col="0"><span>0</span><span>1</span>...<span>9</span></span>
        <span class="ruler-digit-col" data-col="1"><span>0</span><span>1</span>...<span>9</span></span>
        <span class="ruler-digit-col" data-col="2"><span>0</span><span>1</span>...<span>9</span></span>
      </span>
      <span style="margin-left: 2px;">%</span>
    </div>
  </div>
</aside>
